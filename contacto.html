<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="description" content="Ponte en contacto con el equipo de HuertoHogar. Resolvemos tus dudas e inquietudes.">
  <title>HuertoHogar - Contacto</title>
  
  <!-- Estilos -->
  <link rel="stylesheet" href="css/styles.css">
</head>
<body>

  <!-- Encabezado / Navegación -->
  <header class="site-header">
    <div class="contenedor nav-principal">
      <a class="logo" href="index.html">🌱 <span>HuertoHogar</span></a>
      <nav aria-label="Navegación principal">
        <a href="index.html">Inicio</a>
        <a href="productos.html">Productos</a>
        <a href="nosotros.html">Nosotros</a>
        <a href="blog.html">Blog</a>
        <a href="contacto.html" class="activo" aria-current="page">Contacto</a>
        <a href="carrito.html">🛒 Carrito</a>
        <a href="login.html">Iniciar Sesión</a>
        <a href="registro.html">Registrarse</a>
      </nav>
    </div>
  </header>

  <!-- Contenido Principal -->
  <main>
    <section class="contenedor-registro">
      <h2>Contáctanos</h2>
      <p class="ayuda-formulario">¿Tienes dudas o sugerencias? Envíanos un mensaje y te responderemos a la brevedad.</p>
      
      <div id="mensaje-contacto" class="mensaje" role="alert" aria-live="polite"></div>

      <form id="form-contacto" novalidate>
        <div class="grupo-campo">
          <label for="contacto-nombre">Nombre Completo:</label>
          <input type="text" id="contacto-nombre" name="nombre" placeholder="Ej: Juan Pérez" required>
        </div>

        <div class="grupo-campo">
          <label for="contacto-email">Correo Electrónico:</label>
          <input type="email" id="contacto-email" name="email" placeholder="ejemplo@correo.cl" required>
        </div>

        <div class="grupo-campo">
          <label for="contacto-asunto">Asunto:</label>
          <input type="text" id="contacto-asunto" name="asunto" placeholder="Ej: Consulta sobre mi pedido" required>
        </div>

        <div class="grupo-campo">
          <label for="contacto-mensaje">Mensaje:</label>
          <textarea id="contacto-mensaje" name="mensaje" rows="5" placeholder="Escribe tu mensaje aquí..." required></textarea>
        </div>

        <button type="submit" class="btn-submit">Enviar Mensaje</button>
      </form>
    </section>
  </main>

  <!-- Pie de página -->
  <footer class="site-footer">
    <div class="contenedor">
      <p>&copy; 2026 HuertoHogar - Todos los derechos reservados.</p>
    </div>
  </footer>

  <!-- Scripts JS -->
  <script src="js/auth.js"></script>
</body>
</html>
