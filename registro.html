<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="description" content="Crea tu cuenta en HuertoHogar para gestionar tus pedidos de productos frescos.">
  <title>HuertoHogar - Registro de Usuario</title>
  
  <!-- Estilos -->
  <link rel="stylesheet" href="css/styles.css">
</head>
<body>

  <!-- Encabezado / Navegación -->
  <header class="site-header">
    <div class="contenedor nav-principal">
      <a class="logo" href="index.html">🌱 <span>HuertoHogar</span></a>
      <nav aria-label="Navegación principal">
        <a href="index.html">Inicio</a>
        <a href="productos.html">Productos</a>
        <a href="nosotros.html">Nosotros</a>
        <a href="blog.html">Blog</a>
        <a href="contacto.html">Contacto</a>
        <a href="carrito.html">🛒 Carrito</a>
        <a href="login.html">Iniciar Sesión</a>
        <a href="registro.html" class="activo" aria-current="page">Registrarse</a>
      </nav>
    </div>
  </header>

  <!-- Contenido Principal -->
  <main>
    <section class="contenedor-registro">
      <h2>Crear Cuenta</h2>
      <p class="ayuda-formulario">Crea tu cuenta para gestionar tus datos y futuras compras.</p>
      
      <div id="mensaje-registro" class="mensaje" role="alert" aria-live="polite"></div>

      <form id="form-registro" novalidate>
        <div class="grupo-campo">
          <label for="nombre">Nombre Completo:</label>
          <input type="text" id="nombre" name="nombre" placeholder="Ej: Juan Pérez" autocomplete="name" required>
        </div>

        <div class="grupo-campo">
          <label for="rut">RUT:</label>
          <input type="text" id="rut" name="rut" placeholder="Ej: 12345678-K" maxlength="10" required>
        </div>

        <div class="grupo-campo">
          <label for="email">Correo Electrónico:</label>
          <input type="email" id="email" name="email" placeholder="ejemplo@correo.cl" autocomplete="email" required>
        </div>

        <div class="grupo-campo">
          <label for="password">Contraseña:</label>
          <input type="password" id="password" name="password" placeholder="Mínimo 8 caracteres" minlength="8" autocomplete="new-password" required>
        </div>

        <div class="grupo-campo">
          <label for="select-region">Región:</label>
          <select id="select-region" name="region" required>
            <option value="">Seleccione Región</option>
          </select>
        </div>

        <div class="grupo-campo">
          <label for="select-comuna">Comuna:</label>
          <select id="select-comuna" name="comuna" required>
            <option value="">Seleccione Comuna</option>
          </select>
        </div>

        <button type="submit" class="btn-submit">Crear Cuenta</button>
      </form>

      <p>¿Ya tienes cuenta? <a href="login.html">Inicia sesión aquí</a></p>
    </section>
  </main>

  <!-- Pie de página -->
  <footer class="site-footer">
    <div class="contenedor">
      <p>&copy; 2026 HuertoHogar - Todos los derechos reservados.</p>
    </div>
  </footer>

  <!-- Scripts JS -->
  <script src="js/regiones.js"></script>
  <script src="js/validaciones.js"></script>
  <script src="js/auth.js"></script>
</body>
</html>
