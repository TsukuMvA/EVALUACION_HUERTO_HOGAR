<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>HuertoHogar - Registro de Usuario</title>
  <link rel="stylesheet" href="css/styles.css">
</head>
<body>

  <header>
    <h1>HuertoHogar</h1>
    <nav>
      <a href="index.html">Inicio</a>
      <a href="productos.html">Productos</a>
      <a href="nosotros.html">Nosotros</a>
      <a href="blog.html">Blog</a>
      <a href="contacto.html">Contacto</a>
      <a href="carrito.html">Carrito</a>
      <a href="login.html">Iniciar Sesión</a>
      <a href="registro.html">Registrarse</a>
    </nav>
  </header>

  <main>
    <section class="contenedor-registro">
      <h2>Crear Cuenta</h2>
      
      <form id="form-registro">
        <div class="grupo-campo">
          <label for="nombre">Nombre Completo:</label>
          <input type="text" id="nombre" name="nombre" placeholder="Ej: Juan Pérez" required>
        </div>

        <div class="grupo-campo">
          <label for="rut">RUT:</label>
          <input type="text" id="rut" name="rut" placeholder="Ej: 12345678-K" required>
        </div>

        <div class="grupo-campo">
          <label for="email">Correo Electrónico:</label>
          <input type="email" id="email" name="email" placeholder="ejemplo@correo.cl" required>
        </div>

        <div class="grupo-campo">
          <label for="password">Contraseña:</label>
          <input type="password" id="password" name="password" placeholder="Mínimo 6 caracteres" required>
        </div>

        <div class="grupo-campo">
          <label for="select-region">Región:</label>
          <select id="select-region" name="region" required>
            <option value="">Seleccione Región</option>
          </select>
        </div>

        <div class="grupo-campo">
          <label for="select-comuna">Comuna:</label>
          <select id="select-comuna" name="comuna" required>
            <option value="">Seleccione Comuna</option>
          </select>
        </div>

        <button type="submit" class="btn-submit">Registrarse</button>
      </form>

      <p>¿Ya tienes cuenta? <a href="login.html">Inicia sesión aquí</a></p>
    </section>
  </main>

  <footer>
    <p>&copy; 2026 HuertoHogar - Todos los derechos reservados a los papus.</p>
  </footer>

  <!-- Scripts JS -->
  <script src="js/regiones.js"></script>
  <script src="js/validaciones.js"></script>
</body>
</html>
