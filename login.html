<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>HuertoHogar - Iniciar Sesión</title>
  <link rel="stylesheet" href="css/styles.css">
</head>
<body>
  <header>
    <h1>HuertoHogar</h1>
    <p>Productos frescos del campo a tu hogar</p>
    <nav>
      <a href="index.html">Inicio</a>
      <a href="productos.html">Productos</a>
      <a href="nosotros.html">Nosotros</a>
      <a href="blog.html">Blog</a>
      <a href="contacto.html">Contacto</a>
      <a href="carrito.html">Carrito</a>
      <a href="login.html">Iniciar Sesión</a>
      <a href="registro.html">Registrarse</a>
    </nav>
  </header>

  <main>
    <section class="contenedor-login">
      <h2>Iniciar Sesión</h2>

      <div id="mensaje-login" class="mensaje" role="alert" aria-live="polite"></div>

      <form id="form-login">
        <div class="grupo-campo">
          <label for="login-email">Correo Electrónico:</label>
          <input type="email" id="login-email" name="email" placeholder="ejemplo@correo.cl" autocomplete="email" required>
        </div>

        <div class="grupo-campo">
          <label for="login-password">Contraseña:</label>
          <input type="password" id="login-password" name="password" placeholder="Ingresa tu contraseña" autocomplete="current-password" required>
        </div>

        <button type="submit" class="btn-submit">Iniciar Sesión</button>
      </form>

      <p>¿No tienes una cuenta? <a href="registro.html">Regístrate aquí</a></p>
    </section>
  </main>

  <footer>
    <p>&copy; 2026 HuertoHogar - Todos los derechos reservados.</p>
  </footer>

  <script src="js/auth.js"></script>
</body>
</html>
